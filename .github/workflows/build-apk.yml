name: Build Business Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android launcher project
        run: |
          mkdir -p app/src/main/java/com/lauriescreations/businesshome

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BusinessHome"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.lauriescreations.businesshome'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.lauriescreations.businesshome'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <package android:name="com.squareup" />
                  <package android:name="com.facebook.pages.app" />
                  <package android:name="com.squareup.cash" />

                  <intent>
                      <action android:name="android.media.action.STILL_IMAGE_CAMERA" />
                  </intent>

                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.APP_EMAIL" />
                  </intent>

                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:mimeType="image/*" />
                  </intent>

                  <intent>
                      <action android:name="android.settings.SETTINGS" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Business Home"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/lauriescreations/businesshome/MainActivity.java <<'EOF'
          package com.lauriescreations.businesshome;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private final int purple = Color.rgb(92, 45, 132);
              private final int purpleDark = Color.rgb(61, 26, 93);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(purpleDark);
                  getWindow().setNavigationBarColor(purpleDark);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(20), dp(28), dp(20), dp(28));
                  root.setBackgroundColor(Color.rgb(245, 238, 250));

                  TextView title = new TextView(this);
                  title.setText("Laurie's Creations");
                  title.setTextColor(purple);
                  title.setTextSize(29);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, fullWidth(dp(3)));

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Business Home");
                  subtitle.setTextColor(Color.rgb(95, 95, 95));
                  subtitle.setTextSize(16);
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle, fullWidth(dp(24)));

                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(2);
                  grid.setUseDefaultMargins(false);

                  addPackageTile(grid, "Square POS", "com.squareup");
                  addPackageTile(grid, "Meta Business", "com.facebook.pages.app");
                  addPackageTile(grid, "Cash App", "com.squareup.cash");

                  addIntentTile(grid, "Camera", cameraIntent());
                  addIntentTile(grid, "Photos", photosIntent());
                  addIntentTile(grid, "Email", emailIntent());
                  addIntentTile(grid, "Settings", settingsIntent());

                  root.addView(grid, fullWidth(dp(22)));

                  TextView home = new TextView(this);
                  home.setText("Set Business Home as Default");
                  home.setTextSize(17);
                  home.setTextColor(Color.WHITE);
                  home.setGravity(Gravity.CENTER);
                  home.setTypeface(Typeface.DEFAULT_BOLD);
                  home.setPadding(dp(18), dp(16), dp(18), dp(16));

                  GradientDrawable homeBg = new GradientDrawable();
                  homeBg.setColor(purple);
                  homeBg.setCornerRadius(dp(18));
                  home.setBackground(homeBg);

                  home.setOnClickListener(v -> openHomeSettings());

                  root.addView(home, fullWidth(dp(14)));

                  TextView note = new TextView(this);
                  note.setText("Tap an app icon to open it.");
                  note.setTextSize(13);
                  note.setTextColor(Color.rgb(105, 105, 105));
                  note.setGravity(Gravity.CENTER);
                  root.addView(note);

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void addPackageTile(
                      GridLayout grid,
                      String label,
                      String packageName) {

                  Drawable icon = null;

                  try {
                      icon = getPackageManager()
                              .getApplicationIcon(packageName);
                  } catch (Exception ignored) {
                  }

                  Drawable finalIcon = icon;

                  View tile = makeTile(
                          label,
                          finalIcon,
                          () -> launchPackage(packageName)
                  );

                  grid.addView(tile, tileParams());
              }

              private void addIntentTile(
                      GridLayout grid,
                      String label,
                      Intent intent) {

                  Drawable icon = resolveIcon(intent);

                  View tile = makeTile(
                          label,
                          icon,
                          () -> launchIntent(intent)
                  );

                  grid.addView(tile, tileParams());
              }

              private View makeTile(
                      String label,
                      Drawable icon,
                      Runnable onClick) {

                  LinearLayout outer = new LinearLayout(this);
                  outer.setOrientation(LinearLayout.VERTICAL);
                  outer.setGravity(Gravity.CENTER);
                  outer.setPadding(
                          dp(10),
                          dp(16),
                          dp(10),
                          dp(14)
                  );

                  outer.setClickable(true);
                  outer.setFocusable(true);
                  outer.setElevation(dp(4));

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(Color.WHITE);
                  background.setCornerRadius(dp(24));
                  background.setStroke(
                          dp(1),
                          Color.rgb(228, 216, 238)
                  );

                  outer.setBackground(background);

                  FrameLayout iconShell =
                          new FrameLayout(this);

                  GradientDrawable iconBackground =
                          new GradientDrawable();

                  iconBackground.setColor(
                          Color.rgb(239, 230, 246)
                  );

                  iconBackground.setShape(
                          GradientDrawable.OVAL
                  );

                  iconShell.setBackground(iconBackground);

                  LinearLayout.LayoutParams shellParams =
                          new LinearLayout.LayoutParams(
                                  dp(76),
                                  dp(76)
                          );

                  shellParams.bottomMargin = dp(10);

                  ImageView image = new ImageView(this);
                  image.setScaleType(
                          ImageView.ScaleType.FIT_CENTER
                  );

                  image.setPadding(
                          dp(12),
                          dp(12),
                          dp(12),
                          dp(12)
                  );

                  if (icon != null) {
                      image.setImageDrawable(icon);
                  } else {
                      GradientDrawable fallback =
                              new GradientDrawable();

                      fallback.setColor(purple);
                      fallback.setCornerRadius(dp(18));

                      image.setBackground(fallback);
                  }

                  iconShell.addView(
                          image,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  outer.addView(
                          iconShell,
                          shellParams
                  );

                  TextView text = new TextView(this);
                  text.setText(label);
                  text.setTextColor(
                          Color.rgb(54, 45, 61)
                  );
                  text.setTextSize(15);
                  text.setTypeface(
                          Typeface.DEFAULT_BOLD
                  );
                  text.setGravity(Gravity.CENTER);
                  text.setMaxLines(2);

                  outer.addView(text);

                  outer.setOnClickListener(
                          v -> onClick.run()
                  );

                  return outer;
              }

              private GridLayout.LayoutParams tileParams() {

                  GridLayout.LayoutParams params =
                          new GridLayout.LayoutParams();

                  params.width = 0;
                  params.height = dp(132);

                  params.columnSpec =
                          GridLayout.spec(
                                  GridLayout.UNDEFINED,
                                  1f
                          );

                  params.setMargins(
                          dp(7),
                          dp(7),
                          dp(7),
                          dp(7)
                  );

                  return params;
              }

              private Drawable resolveIcon(Intent intent) {

                  try {
                      PackageManager pm =
                              getPackageManager();

                      ResolveInfo info =
                              pm.resolveActivity(
                                      intent,
                                      PackageManager.MATCH_DEFAULT_ONLY
                              );

                      if (info != null) {
                          return info.loadIcon(pm);
                      }

                  } catch (Exception ignored) {
                  }

                  return null;
              }

              private void launchPackage(String packageName) {

                  Intent launch =
                          getPackageManager()
                                  .getLaunchIntentForPackage(
                                          packageName
                                  );

                  if (launch != null) {
                      startActivity(launch);
                      return;
                  }

                  try {
                      startActivity(
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(
                                              "market://details?id="
                                                      + packageName
                                      )
                              )
                      );

                  } catch (ActivityNotFoundException e) {

                      startActivity(
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(
                                              "https://play.google.com/store/apps/details?id="
                                                      + packageName
                                      )
                              )
                      );
                  }
              }

              private void launchIntent(Intent intent) {

                  try {
                      startActivity(intent);

                  } catch (ActivityNotFoundException e) {

                      Toast.makeText(
                              this,
                              "No matching app was found.",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private Intent cameraIntent() {
                  return new Intent(
                          MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA
                  );
              }

              private Intent photosIntent() {

                  Intent intent =
                          new Intent(Intent.ACTION_VIEW);

                  intent.setDataAndType(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          "image/*"
                  );

                  return intent;
              }

              private Intent emailIntent() {

                  Intent intent =
                          new Intent(Intent.ACTION_MAIN);

                  intent.addCategory(
                          Intent.CATEGORY_APP_EMAIL
                  );

                  return intent;
              }

              private Intent settingsIntent() {
                  return new Intent(
                          Settings.ACTION_SETTINGS
                  );
              }

              private void openHomeSettings() {

                  try {
                      startActivity(
                              new Intent(
                                      Settings.ACTION_HOME_SETTINGS
                              )
                      );

                  } catch (ActivityNotFoundException e) {

                      startActivity(
                              new Intent(
                                      Settings.ACTION_SETTINGS
                              )
                      );
                  }
              }

              private LinearLayout.LayoutParams fullWidth(
                      int bottomMargin) {

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  params.bottomMargin =
                          bottomMargin;

                  return params;
              }

              private int dp(int value) {

                  return Math.round(
                          value *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density
                  );
              }

              @Override
              public void onBackPressed() {
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk BusinessHome.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessHome-APK
          path: BusinessHome.apk

      - name: Create APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: businesshome-${{ github.run_number }}
          name: Business Home APK
          files: BusinessHome.apk
