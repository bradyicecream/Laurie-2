name: Build Business Home APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/lauriescreations/businesshome

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BusinessHome"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.lauriescreations.businesshome'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.lauriescreations.businesshome'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <package android:name="com.squareup" />
                  <package android:name="com.facebook.pages.app" />
                  <package android:name="com.squareup.cash" />
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Business Home"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/lauriescreations/businesshome/MainActivity.java <<'EOF'
          package com.lauriescreations.businesshome;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(22), dp(30), dp(22), dp(30));
                  root.setBackgroundColor(Color.rgb(245, 238, 250));

                  TextView title = new TextView(this);
                  title.setText("Laurie's Creations");
                  title.setTextSize(30);
                  title.setTextColor(Color.rgb(91, 35, 130));
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);
                  root.addView(title, fullWidth(dp(8)));

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Business Home");
                  subtitle.setTextSize(18);
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle, fullWidth(dp(24)));

                  addButton(root, "Square POS", v ->
                          launchPackage("com.squareup"));

                  addButton(root, "Meta Business Suite", v ->
                          launchPackage("com.facebook.pages.app"));

                  addButton(root, "Cash App", v ->
                          launchPackage("com.squareup.cash"));

                  addButton(root, "Camera", v -> openCamera());

                  addButton(root, "Photos", v -> openPhotos());

                  addButton(root, "Email", v -> openEmail());

                  addButton(root, "Set as Default Home", v ->
                          openHomeSettings());

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void addButton(
                      LinearLayout root,
                      String text,
                      View.OnClickListener listener) {

                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(19);
                  button.setTextColor(Color.WHITE);
                  button.setAllCaps(false);
                  button.setPadding(dp(12), dp(14), dp(12), dp(14));

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(Color.rgb(112, 53, 150));
                  background.setCornerRadius(dp(16));
                  button.setBackground(background);

                  button.setOnClickListener(listener);

                  root.addView(button, fullWidth(dp(12)));
              }

              private void launchPackage(String packageName) {
                  Intent launch =
                          getPackageManager().getLaunchIntentForPackage(packageName);

                  if (launch != null) {
                      startActivity(launch);
                      return;
                  }

                  try {
                      startActivity(new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("market://details?id=" + packageName)
                      ));
                  } catch (ActivityNotFoundException e) {
                      startActivity(new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse(
                                      "https://play.google.com/store/apps/details?id="
                                              + packageName)
                      ));
                  }
              }

              private void openCamera() {
                  try {
                      startActivity(new Intent(
                              MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA));
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(
                              this,
                              "Camera app not found",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void openPhotos() {
                  Intent intent = new Intent(
                          Intent.ACTION_VIEW,
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI);

                  try {
                      startActivity(intent);
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(
                              this,
                              "Photos app not found",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void openEmail() {
                  Intent intent = new Intent(Intent.ACTION_MAIN);
                  intent.addCategory(Intent.CATEGORY_APP_EMAIL);

                  try {
                      startActivity(intent);
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(
                              this,
                              "Email app not found",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void openHomeSettings() {
                  try {
                      startActivity(
                              new Intent(Settings.ACTION_HOME_SETTINGS));
                  } catch (ActivityNotFoundException e) {
                      startActivity(
                              new Intent(Settings.ACTION_SETTINGS));
                  }
              }

              private LinearLayout.LayoutParams fullWidth(int margin) {
                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT);

                  p.bottomMargin = margin;
                  return p;
              }

              private int dp(int value) {
                  return Math.round(
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density);
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk BusinessHome.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessHome-APK
          path: BusinessHome.apk

      - name: Create APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: businesshome-${{ github.run_number }}
          name: Business Home APK
          files: BusinessHome.apk