
name: Build Laurie's Creations Launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build launcher
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null || true
          "$SDK" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          mkdir -p app/src/main/java/com/lauriescreations/home app/src/main/res/drawable
          cat > settings.gradle <<'END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'LauriesCreations'
          include ':app'
          END
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          cat > app/build.gradle <<'END'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.lauriescreations.home'
            compileSdk 35
            defaultConfig {
              applicationId 'com.lauriescreations.businesshome'
              minSdk 23
              targetSdk 35
              versionCode 11
              versionName '3.1'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          END
          cat > app/src/main/AndroidManifest.xml <<'END'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
              <package android:name="com.squareup" />
              <package android:name="com.facebook.pages.app" />
              <package android:name="com.squareup.cash" />
              <intent><action android:name="android.media.action.STILL_IMAGE_CAMERA" /></intent>
              <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.APP_EMAIL" /></intent>
              <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.APP_CALCULATOR" /></intent>
              <intent><action android:name="android.intent.action.VIEW" /><data android:mimeType="image/*" /></intent>
              <intent><action android:name="android.settings.SETTINGS" /></intent>
            </queries>
            <application android:label="Laurie's Creations"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.HOME" /><category android:name="android.intent.category.DEFAULT" /></intent-filter>
              </activity>
            </application>
          </manifest>
          END
          cat > app/src/main/java/com/lauriescreations/home/MainActivity.java <<'END'
          package com.lauriescreations.home;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.pm.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.net.*;
          import android.provider.*;
          import android.view.*;
          import android.widget.*;
          public class MainActivity extends Activity {
            int purple=Color.rgb(105,46,148);
            int dp(float v){return Math.round(v*getResources().getDisplayMetrics().density);}
            GradientDrawable bg(int color,int radius){GradientDrawable d=new GradientDrawable();d.setColor(color);d.setCornerRadius(dp(radius));return d;}
            Intent category(String c){Intent i=new Intent(Intent.ACTION_MAIN);i.addCategory(c);return i;}
            Intent photo(){Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI,"image/*");return i;}
            @Override public void onCreate(Bundle b){super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(64,24,93));
              ScrollView sc=new ScrollView(this);
              LinearLayout column=new LinearLayout(this);column.setOrientation(1);
              column.setGravity(Gravity.CENTER_HORIZONTAL);
              column.setPadding(dp(16),dp(18),dp(16),dp(25));
              column.setBackgroundColor(Color.rgb(246,238,250));
              ImageView logo=new ImageView(this);logo.setImageResource(R.drawable.logo);
              logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
              LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(dp(175),dp(175));
              lp.bottomMargin=dp(15);column.addView(logo,lp);
              GridLayout grid=new GridLayout(this);grid.setColumnCount(2);
              addApp(grid,"Square POS","com.squareup");
              addApp(grid,"Meta Business","com.facebook.pages.app");
              addApp(grid,"Cash App","com.squareup.cash");
              addIntent(grid,"Camera",new Intent("android.media.action.STILL_IMAGE_CAMERA"));
              addIntent(grid,"Photos",photo());
              addIntent(grid,"Email",category(Intent.CATEGORY_APP_EMAIL));
              addIntent(grid,"Settings",new Intent(Settings.ACTION_SETTINGS));
              addIntent(grid,"Calculator",category("android.intent.category.APP_CALCULATOR"));
              column.addView(grid,new LinearLayout.LayoutParams(-1,-2));
              sc.addView(column);setContentView(sc);
            }
            void addApp(GridLayout grid,String title,String pkg){
              Drawable icon=null;
              try{icon=getPackageManager().getApplicationIcon(pkg);}catch(Exception ignored){}
              final String packageName=pkg;
              addTile(grid,title,icon,()->{
                Intent i=getPackageManager().getLaunchIntentForPackage(packageName);
                if(i!=null){startActivity(i);return;}
                open(new Intent(Intent.ACTION_VIEW,Uri.parse("https://play.google.com/store/apps/details?id="+packageName)));
              });
            }
            void addIntent(GridLayout grid,String title,Intent intent){
              Drawable icon=null;
              try{ResolveInfo r=getPackageManager().resolveActivity(intent,PackageManager.MATCH_DEFAULT_ONLY);
                if(r!=null) icon=r.loadIcon(getPackageManager());}catch(Exception ignored){}
              addTile(grid,title,icon,()->open(intent));
            }
            void open(Intent intent){try{startActivity(intent);}catch(Exception e){Toast.makeText(this,"App not available",Toast.LENGTH_SHORT).show();}}
            void addTile(GridLayout grid,String title,Drawable icon,Runnable action){
              LinearLayout tile=new LinearLayout(this);tile.setOrientation(1);tile.setGravity(Gravity.CENTER);
              tile.setPadding(dp(8),dp(12),dp(8),dp(10));tile.setBackground(bg(Color.WHITE,22));
              tile.setElevation(dp(3));tile.setClickable(true);tile.setFocusable(true);
              ImageView image=new ImageView(this);
              image.setPadding(dp(8),dp(8),dp(8),dp(8));
              if(icon!=null)image.setImageDrawable(icon);else image.setImageResource(android.R.drawable.sym_def_app_icon);
              tile.addView(image,new LinearLayout.LayoutParams(dp(70),dp(70)));
              TextView label=new TextView(this);label.setText(title);label.setTextSize(15);
              label.setTextColor(Color.rgb(57,42,65));label.setGravity(Gravity.CENTER);
              label.setTypeface(null,1);tile.addView(label);
              tile.setOnClickListener(v->action.run());
              GridLayout.LayoutParams p=new GridLayout.LayoutParams();
              p.width=0;p.height=dp(128);p.columnSpec=GridLayout.spec(GridLayout.UNDEFINED,1f);
              p.setMargins(dp(6),dp(6),dp(6),dp(6));grid.addView(tile,p);
            }
          }
          END
